<head>

   /* Контейнер около селекта */

 @media (max-width: 768px) {

    }

		display: none;
    }
	
  #text_calculate {
	display: none;
	}
	
	/* Контейнер около селекта */
	.select-wrapper {
	  max-height: 120px;       /* до 3 реда */

	  width: 200px;
	 margin-top: -10px;
	}

	/* Принудително ограничаване височината на избраните елементи */

	}

		}

		height: 80px;

	}

		margin-left: -130px;

  </style>
</head>
<body>
<div class="fixed-header">
  <div class="top-bar">
    <div class="filters">
      <div class="filter-group">
        <!--<label for="search">Търсене:</label> -->
        <div class="select-wrapper">
			<select id="search" multiple style="width: 100%;"></select>
		</div>
        <span id="clearSearch">×</span>
        <button id="exportBtn" onclick="exportVisibleToExcel()">📤 Експортирай</button>
      </div>
      <div class="logo-and-info">
          <img class="logo-and-info img" src="stabil_di_Caption.png" alt="Лого">

           Част от група дружества<br><span style="font-style: italic;">Деан Стоянов</span>
          </div>
		  </div>
          <div class="summary">
            <span id="text_calculate">Маркирани документи: </span>
            <div class="summary-actions">
				<span id="sumSelected">0.00 €</span>
              <button id="clearBtn" onclick="clearSelection()">❌</button>
            </div>
          </div>
      
    </div>
  </div>
</div>
  <div class="table-container">
    <!--MAIN_TABLE_HERE-->
  </div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
    document.addEventListener("click", function (e) {
      const target = e.target;
      if (target.tagName === "TD") {
        const row = target.parentElement;
        row.classList.toggle("selected");
        updateSelectedSum();
      }
    });

    function updateSelectedSum() {
      let sum = 0;
      const rows = document.querySelectorAll("table tbody tr.selected");
      rows.forEach(row => {
        const cellText = row.cells[3]?.innerText.replace(/[^\-\d.,]/g, "").replace(",", ".");
        const value = parseFloat(cellText);
        if (!isNaN(value)) {
          sum += value;
        }
      });
      document.getElementById("sumSelected").innerText = sum.toFixed(2) + " €";
    }
  </script>

<script>
  const input = document.getElementById("search");
  const clearBtn = document.getElementById("clearSearch");

  input.addEventListener("input", () => {
    clearBtn.style.display = input.value ? "inline" : "none";
  });

  clearBtn.addEventListener("click", () => {
    input.value = "";
    clearBtn.style.display = "none";
    filterTable(); // активира търсачката с празно поле
  });
</script>

<script>
  function exportVisibleToExcel() {
  const table = document.querySelector("table");  // или замести със selector-а си
  const headers = Array.from(table.querySelectorAll("thead th"))
    .slice(0, -1)
    .map(th => th.innerText);

  const visibleRows = Array.from(table.querySelectorAll("tbody tr"))
    .filter(row => row.style.display !== "none")
    .map(row => {
      const cells = Array.from(row.querySelectorAll("td"));
      const selectedCells = cells.slice(0, -1).map(td => td.innerText);

      // Преобразуваме последната видима стойност в число
      const lastIndex = selectedCells.length - 1;
      if (lastIndex >= 0) {
        let val = selectedCells[lastIndex]
          .replace(/\s+/g, "")         // махаме интервали (напр. 1 234)
          .replace("лв.", "")          // махаме "лв."
          .replace(",", ".")          // запетая → точка
		  .replace("€", "")   ;       // махаме "€"

        const num = parseFloat(val);
        if (!isNaN(num)) selectedCells[lastIndex] = num;
      }

      return selectedCells;
    });

  if (visibleRows.length === 0) {
    alert("Няма видими редове за експортиране.");
    return;
  }

  const data = [headers, ...visibleRows];

  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Таблица");

  XLSX.writeFile(wb, "таблица.xlsx");
}
</script>
<script>
  function clearSelection() {
    const selectedRows = document.querySelectorAll("table tbody tr.selected");
    selectedRows.forEach(row => row.classList.remove("selected"));
    updateSelectedSum();
  }
  </script>
 
 <script>
$(document).ready(function () {
  const $select = $('#search');
  const allNames = new Set();       // Всички уникални имена
  const namesForSelect = new Set(); // Само тези, които не завършват на 'общо:'

  // 1. Извличане на всички имена от първата колона
  $('table tbody tr').each(function () {
    const name = $(this).find('td').eq(0).text().trim();
    if (name) {
      allNames.add(name);

      // Пропускаме тези, които завършват на 'общо:'
      if (!name.toLowerCase().endsWith('общо:')) {
        namesForSelect.add(name);
      }
    }
  });

  // 2. Добавяне във <select> само валидните за избор
  namesForSelect.forEach(name => {
    $select.append(new Option(name, name));
  });

  // 3. Инициализация на Select2
  $select.select2({
    placeholder: "Избери контрагент(и)",
    allowClear: true,
    width: 'resolve',
    dropdownAutoWidth: true,
    closeOnSelect: false,
    maximumSelectionLength: 100
  });

  // 4. Филтриране
  $select.on('change', function () {
    const selected = $(this).val(); // масив с избрани

    $('table tbody tr').each(function () {
      const rowName = $(this).find('td').eq(0).text().trim();

      // Ако няма селекция, показваме всичко
      if (!selected || selected.length === 0) {
        $(this).show();
        return;
      }

      // Проверка: дали някое от избраните съвпада с началото на реда (за да включим и "общо:")
      const shouldShow = selected.some(sel => rowName.startsWith(sel));
      $(this).toggle(shouldShow);
    });
  });

  // 5. Вътрешен скрол при много избрани
  $('.select2-selection__rendered').css({
    'max-height': '60px',
    'overflow-y': 'auto'
  });
});
</script>


</body>
